[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-1d"
version = "1.0.0"
description = "From-scratch 1-D DFT and iterative radix-2 FFT in Python for transparent signal analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Juan David Prada Malagon", email = "pradamalagonjd@gmail.com" },
]
keywords = [
  "python",
  "numpy",
  "fft",
  "dft",
  "fourier-transform",
  "signal-processing",
  "spectral-analysis",
  "numerical-methods",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
demo = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/juandapradam12/FourierTransform1D"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
