[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-1d"
version = "1.0.0"
description = "From-scratch 1-D DFT/FFT toolkit for signal-analysis portfolios"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Juan David Prada Malagon", email = "pradamalagonjd@gmail.com" },
]
keywords = ["fourier", "dft", "fft", "signal-processing", "numpy"]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
demo = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/juandapradam12/Fourier-Transform-Implementation-1D"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
